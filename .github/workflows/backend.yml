name: Testes do backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm --prefix functions ci
      - run: npm --prefix functions run typecheck
      - run: npx --yes firebase-tools@15.37.0 emulators:exec --project demo-lavanderia --only firestore "npm --prefix functions test"
