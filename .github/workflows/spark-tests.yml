name: Testes das filas Spark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - run: npx --yes firebase-tools@15.37.0 emulators:exec --project demo-lavanderia-tests --only firestore "npm test"
      - run: node --test notifications/*.test.mjs
